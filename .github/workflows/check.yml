name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build.mjs
      - run: node --test
      - name: types and generated javascript
        run: |
          npm install --prefix "$RUNNER_TEMP/ts" typescript@5.6.3
          TSC="$RUNNER_TEMP/ts/node_modules/typescript/bin/tsc"
          "$TSC" -p tsconfig.json --noEmit --pretty false
          "$TSC" -p tsconfig.worker.json --noEmit --pretty false
          node scripts/check-emit.mjs "$TSC"
      - name: working tree stays clean
        run: git diff --exit-code
