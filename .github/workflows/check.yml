name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build.mjs
      - run: node --test
      - name: types
        run: |
          npm install --prefix "$RUNNER_TEMP/ts" typescript@5.6.3
          "$RUNNER_TEMP/ts/node_modules/typescript/bin/tsc" -p tsconfig.json --noEmit --pretty false
